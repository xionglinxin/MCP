[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ensp-mcp"
version = "0.2.0"
description = "MCP server for generating Huawei eNSP network topology files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
py-modules = ["server", "ensp_driver", "schema", "config"]
