[project]
name = "visio-draw-mcp"
version = "2.1.0"
description = "MCP Server for Visio diagram automation"
authors = [{name = "xionglinxin"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "mcp==1.29.0",
    "pydantic>=2.0.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
py-modules = ["server", "visio_driver", "drawing", "session", "layout", "schema", "config", "generate_redundant_gateway_topology", "generate_firewall_case_28"]
